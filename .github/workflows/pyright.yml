name: Pyright Lint

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "torappu/**"

jobs:
  pyright:
    name: Pyright Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python environment
        uses: ./.github/actions/setup-python

      - run: echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Run Pyright
        uses: jakebailey/pyright-action@v3
        with:
          version: 1.1.413 # https://github.com/microsoft/pyright/issues/11481
